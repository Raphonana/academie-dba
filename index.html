<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Remplacé par la valeur de --base-href au moment de « flutter build web ». -->
  <base href="/academie-dba/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cours Oracle Database 19c gratuits, en français : SQL, PL/SQL, administration, performance, Data Guard. Leçons, quiz, exercices SQL corrigés et incidents de production à résoudre.">
  <meta name="theme-color" content="#071022">

  <!-- Installation sur l'écran d'accueil (iOS) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Académie DBA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Académie DBA · Cours Oracle 19c en français</title>

  <style>
    html, body { margin: 0; height: 100%; background: #01060f; }
    /* Écran de chargement, retiré dès que l'application affiche sa première image. */
    #chargement {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 36px;
      background: linear-gradient(#0a1c3c, #01060f);
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #93a4be;
      transition: opacity .4s;
    }
    #chargement img { width: min(260px, 60vw); height: auto; }
    #chargement .barre { width: 160px; height: 3px; border-radius: 3px; background: #1c2f4f; overflow: hidden; }
    #chargement .barre::after {
      content: ""; display: block; width: 40%; height: 100%; background: #e8202e; border-radius: 3px;
      animation: glisse 1.1s ease-in-out infinite;
    }
    @keyframes glisse { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #chargement .barre::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="chargement" role="status" aria-label="Chargement d'Académie DBA">
    <img src="icons/logo.png" alt="Académie DBA">
    <div class="barre"></div>
    <div>Chargement des cours…</div>
  </div>
  <noscript>
    <p style="color:#e6edf7;font-family:sans-serif;padding:24px">Académie DBA a besoin de JavaScript pour fonctionner.</p>
  </noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('chargement');
      c.style.opacity = '0';
      setTimeout(function () { c.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
